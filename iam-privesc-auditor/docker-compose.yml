version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: iam-privesc-lab
    ports:
      - "4566:4566"       # LocalStack's single edge port — all services go through this
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
      - SERVICES=iam,sts,cloudtrail,s3,ec2
      - DEBUG=0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
